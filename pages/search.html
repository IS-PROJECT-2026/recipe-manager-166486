<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">

    <title>Search Recipes | Recipe Manager</title>

    <link rel="stylesheet" href="../css/style.css">
</head>

<body>

    <header class="site-header">
        <div class="container nav-container">

            <a href="../index.html" class="logo">
                Recipe Manager
            </a>

            <nav class="main-nav" aria-label="Main navigation">
                <a href="../index.html">Home</a>
                <a href="../index.html#recipes">Recipes</a>
                <a href="../index.html#categories">Categories</a>
                <a href="../index.html#about">About</a>
                <a href="search.html">Search</a>
            </nav>

        </div>
    </header>

    <main>

        <section class="search-section">
            <div class="container">

                <div class="section-heading">
                    <p class="section-label">DISCOVER</p>

                    <h1>Search Recipes</h1>

                    <p>
                        Search by recipe name or category.
                    </p>
                </div>

                <div class="filter-controls">
                    <label for="category-filter">Category</label>
                    <select id="category-filter">
                        <option value="all">All Categories</option>
                        <option value="Breakfast">Breakfast</option>
                        <option value="Lunch">Lunch</option>
                        <option value="Dinner">Dinner</option>
                        <option value="Dessert">Dessert</option>
                    </select>
                </div>

                <form id="search-form" class="search-form">

                    <input
                        type="search"
                        id="search-input"
                        placeholder="Search recipes..."
                        aria-label="Search recipes"
                    >

                    <button type="submit">
                        Search
                    </button>

                </form>

                <div id="search-results" class="recipe-grid">
                    <!-- Search results -->
                </div>

                <p id="no-results" class="no-results">
                    No recipes found.
                </p>

            </div>
        </section>

    </main>

    <footer class="site-footer">
        <div class="container footer-content">
            <p>Discover. Cook. Enjoy.</p>
        </div>
    </footer>

    <script src="../data/recipes.js"></script>
    <script src="../js/search.js"></script>

</body>
</html>
